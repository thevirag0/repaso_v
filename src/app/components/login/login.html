<h3>Log In</h3>
<p-floatlabel variant="in">
    <input class="m-4" type="email" id="email" pInputText [(ngModel)]="email">
    <label for="email">Email</label>
</p-floatlabel>
<p-floatlabel variant="in">
    <input class="m-4" type="password" id="pwd" pInputText [(ngModel)]="password" >
    <label for="password">Password</label>
</p-floatlabel>
    <p-button label="Log In" (click)="logIn()"/>
    {{message()}}
